<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SatooriLabs | Business Simulation</title>

<style>
body{
font-family: Arial;
background:#eef4ff;
text-align:center;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:60%;
margin:auto;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

.option{
display:block;
background:#007BFF;
color:white;
padding:12px;
margin:10px;
border-radius:6px;
cursor:pointer;
border:none;
}

.option:hover{
background:#0056b3;
}

.restart{
background:#28a745;
}

.restart:hover{
background:#1e7e34;
}
</style>

</head>

<body>

<div class="container">

<h2>Business Simulation</h2>

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

<button class="option restart" onclick="restartSimulation()">
Restart Simulation
</button>

</div>

<script>

let score = 0;
let stage = 0;

let simulation = [

{
question:"A customer complains about poor service.",
options:[
{text:"Listen and resolve professionally", score:5},
{text:"Ignore complaint", score:0},
{text:"Blame customer", score:1},
{text:"Transfer responsibility", score:2}
]
},

{
question:"Team missed a deadline.",
options:[
{text:"Support and improve process", score:5},
{text:"Blame team", score:0},
{text:"Ignore issue", score:1}
]
},

{
question:"Client requests urgent change.",
options:[
{text:"Assess and respond professionally", score:5},
{text:"Refuse immediately", score:0}
]
},

{
question:"Project completed.",
options:[
{text:"Review and learn", score:5}
]
}

];

function loadStage(){

let current = simulation[stage];

document.getElementById("question").innerHTML =
"<h3>"+current.question+"</h3>";

let html="";

current.options.forEach((opt,i)=>{

html += "<button class='option' onclick='choose("+i+")'>"
+ opt.text +
"</button>";

});

document.getElementById("options").innerHTML = html;

}

function choose(i){

score += simulation[stage].options[i].score;

stage++;

if(stage < simulation.length){

loadStage();

}else{

finish();

}

}

function finish(){

let feedback="";

if(score>=18){

feedback="Excellent professional performance";

}
else if(score>=10){

feedback="Good, but improvement possible";

}
else{

feedback="Unprofessional decision making";

}

document.getElementById("question").innerHTML="Completed";

document.getElementById("options").innerHTML="";

document.getElementById("result").innerHTML=

feedback + "<br><br>Score: "+score;

saveResult(score);

}

function restartSimulation(){

score=0;
stage=0;
document.getElementById("result").innerHTML="";
loadStage();

}

function saveResult(score){

let name = localStorage.getItem("studentName") || "Student";

let results =
JSON.parse(localStorage.getItem(name)) || {};

if(!results["Business"]){

results["Business"]=[];

}

results["Business"].push({

score:score,
date:new Date().toLocaleString()

});

localStorage.setItem(name, JSON.stringify(results));

}

loadStage();

</script>

</body>
</html>
<br><br>

<button onclick="goHome()" style="
padding: 12px 24px;
font-size: 16px;
background-color: #16a34a;
color: white;
border: none;
border-radius: 8px;
cursor: pointer;
">

Return to Homepage

</button>

<script>

function goHome(){

window.location.href="index.html";

}

</script>
