<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>SatooriLabs – Digital Skills Simulation</title>

<style>

body{
font-family:Arial;
background:#f4f7fb;
}

.container{

max-width:700px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);

}

button{

display:block;
margin-top:10px;
padding:12px;
width:100%;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;

}

button:hover{
background:#1d4ed8;
}

#result{
font-size:20px;
font-weight:bold;
margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<h2>Digital Skills Simulation</h2>

<div id="login">

Enter your name:

<input type="text" id="studentName" style="width:100%;padding:10px;margin-top:10px;">

<button onclick="startSimulation()">Start Simulation</button>

</div>

<div id="simulation" style="display:none;">

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

<button onclick="restartSimulation()">Restart Simulation</button>

</div>

</div>

<script>

let studentName="";

let stage=0;

let score=0;



const scenarios=[

{

question:"You receive an email asking for your password.",

options:[

{ text:"Send password", score:0},

{ text:"Ignore email", score:5},

{ text:"Check sender address", score:10},

{ text:"Report phishing", score:15}

]

},

{

question:"You must create a password.",

options:[

{ text:"123456", score:0},

{ text:"password", score:5},

{ text:"John1990", score:10},

{ text:"A$7kP!9z", score:15}

]

},

{

question:"You see fake news online.",

options:[

{ text:"Share immediately", score:0},

{ text:"Like it", score:5},

{ text:"Ignore", score:10},

{ text:"Verify source", score:15}

]

},

{

question:"A stranger asks for personal info.",

options:[

{ text:"Give info", score:0},

{ text:"Give partial info", score:5},

{ text:"Refuse", score:10},

{ text:"Block and report", score:15}

]

}

];



function startSimulation(){

studentName=document.getElementById("studentName").value;

if(studentName==""){

alert("Enter your name");

return;

}

document.getElementById("login").style.display="none";

document.getElementById("simulation").style.display="block";

stage=0;

score=0;

showStage();

}



function showStage(){

if(stage>=scenarios.length){

showResult();

return;

}

let q=scenarios[stage];

document.getElementById("question").innerHTML="<h3>"+q.question+"</h3>";

let html="";

q.options.forEach((opt,index)=>{

html+="<button onclick='chooseOption("+index+")'>"+opt.text+"</button>";

});

document.getElementById("options").innerHTML=html;

}



function chooseOption(index){

score+=scenarios[stage].options[index].score;

stage++;

showStage();

}



function showResult(){

let message="";

if(score>=50){

message="Excellent digital professional.";

}

else if(score>=35){

message="Good, but improvement possible.";

}

else if(score>=20){

message="Needs improvement.";

}

else{

message="Unsafe digital behaviour.";

}



document.getElementById("question").innerHTML="Simulation complete";

document.getElementById("options").innerHTML="";

document.getElementById("result").innerHTML=

studentName+"<br>Score: "+score+"/60<br>"+message;



saveResult();

}



function saveResult(){

let results=JSON.parse(localStorage.getItem("satooriDigitalResults")||"[]");

results.push({

name:studentName,

score:score,

date:new Date().toLocaleString()

});

localStorage.setItem("satooriDigitalResults",JSON.stringify(results));

}



function restartSimulation(){

location.reload();

}



</script>

</body>

</html>
