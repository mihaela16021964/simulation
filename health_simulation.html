<!DOCTYPE html>
<html>
<head>
<title>Health & Social Care Simulation – SatooriLabs</title>

<style>

body{
font-family: Arial;
background-color:#f4f8fb;
text-align:center;
padding:40px;
}

.box{

background:white;
padding:30px;
border-radius:10px;
width:60%;
margin:auto;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);

}

button{

display:block;
margin:10px auto;
padding:10px 20px;
font-size:16px;
border:none;
border-radius:5px;
background-color:#007BFF;
color:white;
cursor:pointer;

}

button:hover{

background-color:#0056b3;

}

.restart{

background-color:#28a745;

}

</style>

</head>

<body>

<div class="box">

<h2>Health & Social Care Simulation</h2>

<div id="question"></div>

<div id="options"></div>

<div id="result"></div>

<button class="restart" onclick="restartSimulation()">Restart</button>

</div>


<script>

let score = 0;

let stage = 0;


let simulation = [

{

question:"A patient refuses medication. What do you do?",

options:[

{text:"Respect decision and inform senior", score:5},

{text:"Force medication", score:0},

{text:"Ignore situation", score:1},

{text:"Ask colleague to deal with it", score:2}

]

},

{

question:"Patient is upset. Your response?",

options:[

{text:"Listen actively", score:5},

{text:"Tell them to calm down", score:1},

{text:"Ignore", score:0}

]

},

{

question:"Confidential information is visible. What do you do?",

options:[

{text:"Secure it immediately", score:5},

{text:"Leave it", score:0}

]

},

{

question:"Patient thanks you emotionally.",

options:[

{text:"Respond professionally and empathetically", score:5}

]

}

];



function loadStage(){

let q = simulation[stage];

document.getElementById("question").innerHTML = q.question;

document.getElementById("options").innerHTML = "";

q.options.forEach((option,index)=>{

let button = document.createElement("button");

button.innerHTML = option.text;

button.onclick = function(){

choose(index);

};

document.getElementById("options").appendChild(button);

});

}


function choose(index){

score = score + simulation[stage].options[index].score;

stage++;

if(stage < simulation.length){

loadStage();

}

else{

showResult();

}

}


function showResult(){

saveResult("Health Simulation", score);

let message="";

if(score>=18){

message="Excellent professional decision-making.";

}

else if(score>=10){

message="Good, but you can improve.";

}

else{

message="This was an unprofessional decision. Please review your choices.";

}

document.getElementById("question").innerHTML="Simulation complete";

document.getElementById("options").innerHTML="";

document.getElementById("result").innerHTML=

message+"<br><br>Your score: "+score;

}



function restartSimulation(){

score=0;

stage=0;

loadStage();

document.getElementById("result").innerHTML="";

}



function saveResult(scenario, score){

let student = localStorage.getItem("studentName");

if(!student){

student="Guest";

}

let results = JSON.parse(localStorage.getItem(student)) || {};

if(!results[scenario]){

results[scenario]=[];

}

results[scenario].push(score);

localStorage.setItem(student, JSON.stringify(results));

}



loadStage();

</script>

</body>

</html>
