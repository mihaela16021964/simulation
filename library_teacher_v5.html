<!DOCTYPE html>
<html>
<head>
  <title>Teacher Library V5</title>
</head>
<body>

<h2>Teacher Library V5</h2>

<div id="library"></div>

<script>
async function loadLibrary(){
  let html = "";

  if (!window.getFirestoreLibrary) {
    document.getElementById("library").innerHTML =
      "<p>Loading simulations...</p>";
    return;
  }

  try {
    const snapshot = await window.getFirestoreLibrary();

    if (snapshot.empty) {
      html = "<p>No simulations saved yet.</p>";
    } else {
      snapshot.forEach(docSnap => {
        const sim = docSnap.data();
        const simId = docSnap.id;

        html += `
          <div style="border:1px solid #ccc; padding:10px; margin:10px;">
            <b>${sim.title || ""}</b><br>
            Subject: ${sim.subject || ""}<br><br>
            <button onclick="openSim('${simId}')">Open</button>
            <button onclick="editSim('${simId}')">Edit</button>
          </div>
        `;
      });
    }

    document.getElementById("library").innerHTML = html;

  } catch (error) {
    console.error("Failed to load Firestore library:", error);
    document.getElementById("library").innerHTML =
      "<p>Could not load simulations from Firestore.</p>";
  }
}
function openSim(id){
  window.location.href = "play_v5.html?id=" + id;
}

function editSim(id){
  window.location.href = "teacher_builder_v5.html?edit=" + id;
}
function getEditId(){
  const params = new URLSearchParams(window.location.search);
  return params.get("edit");
}
loadLibrary();
  const editId = getEditId();

if(editId){
  loadSimulationFromFirestore(editId);
} else {
  loadStageIntoForm();
  updatePreview();
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDotQaJXVcKgfRtUfOlHB1fT5Xa3iFRIyw",
  authDomain: "satoori-simulations.firebaseapp.com",
  projectId: "satoori-simulations",
  storageBucket: "satoori-simulations.firebasestorage.app",
  messagingSenderId: "62316008106",
  appId: "1:62316008106:web:68a421970d857348e476d3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.getFirestoreLibrary = async function() {
  return await getDocs(collection(db, "simulations"));
};

if (window.loadLibrary) {
  window.loadLibrary();
}
   window.loadLibrary = loadLibrary;
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

window.getSimulationById = async function(id){
  const ref = doc(db, "simulations", id);
  const snap = await getDoc(ref);

  if(snap.exists()){
    return snap.data();
  } else {
    return null;
  }
};

</script>
