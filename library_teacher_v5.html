<!DOCTYPE html>
<html>
<head>
  <title>Teacher Library V5</title>
</head>
<body>

<h2>Teacher Library V5</h2>

<div id="library"></div>

<script>
function loadLibrary(){
  let library = JSON.parse(localStorage.getItem("teacherSimLibraryV5") || "[]");
  let html = "";

  if(library.length === 0){
    html = "<p>No simulations saved yet.</p>";
  } else {
    library.forEach(sim => {
      html += `
        <div style="border:1px solid #ccc; padding:10px; margin:10px;">
          <b>${sim.title || ""}</b><br>
          Subject: ${sim.subject || ""}<br><br>
          <button onclick="openSim('${sim.id}')">Open</button>
<button onclick="editSim('${sim.id}')">Edit</button>
<button onclick="exportSim('${sim.id}')">Export HTML</button>
        </div>
      `;
    });
  }

  document.getElementById("library").innerHTML = html;
}

function openSim(id){
  window.location.href = "play_v5.html?id=" + id;
}

function editSim(id){
  window.location.href = "teacher_builder_v5.html?edit=" + id;
}
function exportSim(id){
  let library = JSON.parse(localStorage.getItem("teacherSimLibraryV5") || "[]");
  let sim = library.find(s => s.id === id);

  if(!sim){
    alert("Simulation not found.");
    return;
  }

  const html = buildStandaloneHTML(sim);
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);

  const safeName = (sim.title || "simulation")
    .replace(/[^a-z0-9]/gi, "_")
    .toLowerCase();

  const a = document.createElement("a");
  a.href = url;
  a.download = safeName + ".html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}

function buildStandaloneHTML(sim){
  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${sim.title || "Simulation"}</title>
<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  margin:0;
  padding:20px;
}
.container{
  max-width:1000px;
  margin:auto;
  background:white;
  padding:24px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.08);
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  background:#2563eb;
  color:white;
}
button:hover{
  background:#1d4ed8;
}
.badge{
  display:inline-block;
  padding:6px 12px;
  background:#dbeafe;
  color:#1d4ed8;
  border-radius:999px;
  font-size:13px;
  margin-bottom:10px;
}
.preview-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}
.preview-table td,
.preview-table th{
  border:1px solid #cbd5e1;
  padding:8px;
}
#result{
  margin-top:20px;
  font-weight:bold;
  font-size:18px;
}
</style>
</head>
<body>

<div class="container">
  <div id="content"></div>
  <div id="options"></div>
  <div id="result"></div>
  <button onclick="restartSimulation()">Restart Simulation</button>
</div>

<script>
function getYouTubeEmbed(url){
  if(!url) return "";
  let id = "";
  if(url.includes("watch?v=")){
    id = url.split("watch?v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1].split("?")[0];
  }
  if(id){
    return '<iframe width="100%" height="260" src="https://www.youtube.com/embed/' + id + '" frameborder="0" allowfullscreen></iframe>';
  }
  return "";
}

function renderTable(table){
  if(!table) return "";
  const hasTitle = table.title && table.title.trim() !== "";
  const hasHeaders = table.headers && table.headers.some(h => h && h.trim() !== "");
  const hasRows = table.rows && table.rows.flat().some(c => c && c.trim() !== "");
  if(!hasTitle && !hasHeaders && !hasRows) return "";

  let html = "";
  if(hasTitle){
    html += "<h4>" + (table.title || "") + "</h4>";
  }
  html += '<table class="preview-table">';
  if(hasHeaders){
    html += "<tr>";
    table.headers.forEach(h => {
      html += "<th>" + (h || "") + "</th>";
    });
    html += "</tr>";
  }
  if(table.rows){
    table.rows.forEach(row => {
      if(row.some(c => c && c.trim() !== "")){
        html += "<tr>";
        row.forEach(c => {
          html += "<td>" + (c || "") + "</td>";
        });
        html += "</tr>";
      }
    });
  }
  html += "</table>";
  return html;
}

let simulation = ${JSON.stringify(sim)};
let currentStage = 0;
let score = 0;

function showStage(){
  if(currentStage >= simulation.stages.length){
    finishSimulation();
    return;
  }

  const stage = simulation.stages[currentStage];

  let html = "<h2>" + (simulation.subject || "") + "</h2>";
  html += "<h3>" + (simulation.title || "") + "</h3>";
  html += '<div class="badge">Stage ' + (currentStage + 1) + "</div>";
  html += "<h3>" + (stage.stageTitle || "Untitled Stage") + "</h3>";

  if(simulation.description){
    html += "<p><b>Description:</b> " + simulation.description + "</p>";
  }

  if(simulation.level){
    html += "<p><b>Level:</b> " + simulation.level + "</p>";
  }

  html += "<p>" + (stage.scenarioText || "").replace(/\\n/g,"<br>") + "</p>";

  if(stage.imageUrl){
    html += '<img src="' + stage.imageUrl + '" style="max-width:100%;border-radius:10px;margin-top:10px;">';
  }

  if(stage.audioUrl){
    html += '<div style="margin-top:10px;"><audio controls src="' + stage.audioUrl + '" style="width:100%;"></audio></div>';
  }

  const yt = getYouTubeEmbed(stage.videoUrl);
  if(yt){
    html += '<div style="margin-top:10px;">' + yt + '</div>';
  } else if(stage.videoUrl){
    html += '<div style="margin-top:10px;"><video controls src="' + stage.videoUrl + '" style="width:100%;border-radius:10px;"></video></div>';
  }

  html += renderTable(stage.table);

  document.getElementById("content").innerHTML = html;

  let buttons = "";
  stage.options.forEach((opt, index) => {
    if(opt.text && opt.text.trim() !== ""){
      const label = opt.label ? "<b>" + opt.label + "</b><br>" : "";
      buttons += '<button onclick="chooseOption(' + index + ')">' + label + opt.text + "</button>";
    }
  });

  document.getElementById("options").innerHTML = buttons;
  document.getElementById("result").innerHTML = "";
}

function chooseOption(index){
  const stage = simulation.stages[currentStage];
  const selected = stage.options[index];
  score += Number(selected.points || 0);

  let next = selected.nextStage;
  if(next === "" || next === null || next === undefined){
    currentStage++;
  } else {
    next = Number(next);
    if(isNaN(next) || next < 1 || next > simulation.stages.length){
      currentStage++;
    } else {
      currentStage = next - 1;
    }
  }

  showStage();
}

function finishSimulation(){
  let feedback = "";
  if(score >= 15){
    feedback = "Excellent decisions throughout the simulation.";
  } else if(score >= 8){
    feedback = "Good performance, with room for improvement.";
  } else if(score >= 1){
    feedback = "Simulation completed. Review your choices and try again.";
  } else {
    feedback = "This path suggests weak decision-making. Reflection is recommended.";
  }

  document.getElementById("content").innerHTML =
    "<h2>" + (simulation.subject || "") + "</h2>" +
    "<h3>" + (simulation.title || "") + "</h3>" +
    "<h3>Simulation Complete</h3>";

  document.getElementById("options").innerHTML = "";
  document.getElementById("result").innerHTML =
    "Final score: " + score + "<br><br>" + feedback;
}

function restartSimulation(){
  currentStage = 0;
  score = 0;
  showStage();
}

showStage();
</script>

</body>
</html>`;
}
loadLibrary();
</script>

</body>
</html>
