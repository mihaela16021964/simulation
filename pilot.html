<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome to SatooriLabs Pilot</title>

<style>

body{

font-family:Arial;
background:#f4f7fb;
text-align:center;
padding-top:100px;

}

.container{

background:white;
padding:40px;
border-radius:10px;
display:inline-block;
box-shadow:0 0 10px rgba(0,0,0,0.1);

}

button{

padding:15px 30px;
font-size:18px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:20px;

}

</style>

</head>

<body>

<div class="container">

<h1>Welcome to SatooriLabs</h1>

<p>Simulation Pilot</p>

<p>Please enter your name:</p>

<input type="text" id="studentName"
style="padding:10px;font-size:16px;width:250px;">

<br>

<button onclick="<script>
function startPilot(){
  let name = document.getElementById("studentName").value.trim();

  if(name === ""){
    alert("Please enter your name");
    return;
  }

  // 1) Add student to class list (activeStudents)
  let active = JSON.parse(localStorage.getItem("activeStudents") || "[]");
  if(!active.includes(name)){
    active.push(name);
    localStorage.setItem("activeStudents", JSON.stringify(active));
  }

  // 2) If a reminder exists for this student, show it ON OPEN
  const reminderKey = "reminder_" + name;
  const msg = localStorage.getItem(reminderKey);
  if(msg){
    alert(msg);
    localStorage.removeItem(reminderKey); // show once only
  }

  // 3) Save name for simulations
  localStorage.setItem("pilotStudentName", name);

  // 4) Send them to the chosen simulation (keep yours)
  window.location.href = "health_simulation_v2.html";
}
</script>">

Start Simulation

</button>

</div>

<script>

function startPilot(){

let name=document.getElementById("studentName").value;


if(name==""){

alert("Please enter your name");

return;

}


localStorage.setItem("pilotStudentName",name);


window.location.href="health_simulation_v2.html";


}

</script>

</body>

</html>
