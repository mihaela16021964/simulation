<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatooriLabs – Player V5</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  margin:0;
  padding:20px;
}

.container{
  max-width:1000px;
  margin:auto;
  background:white;
  padding:24px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.08);
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  background:#2563eb;
  color:white;
}

button:hover{
  background:#1d4ed8;
}

.green{
  background:#16a34a;
}

.green:hover{
  background:#15803d;
}

.gray{
  background:#64748b;
}

.gray:hover{
  background:#475569;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  background:#dbeafe;
  color:#1d4ed8;
  border-radius:999px;
  font-size:13px;
  margin-bottom:10px;
}

#result{
  margin-top:20px;
  font-weight:bold;
  font-size:18px;
}

small{
  color:#475569;
}

.preview-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

.preview-table td,
.preview-table th{
  border:1px solid #cbd5e1;
  padding:8px;
}
</style>
</head>
<body>

<div class="container">

  <div id="content"></div>
  <div id="options"></div>
  <div id="result"></div>

  <br>

  <button class="gray" onclick="restartSimulation()">Restart Simulation</button>
  <button class="green" onclick="goHome()">Return to Homepage</button>

</div>

<script>
function getYouTubeEmbed(url){
  if(!url) return "";
  let id = "";
  if(url.includes("watch?v=")){
    id = url.split("watch?v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1].split("?")[0];
  }
  if(id){
    return `<iframe width="100%" height="260" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`;
  }
  return "";
}

function getParam(name){
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function renderTable(table){
  if(!table) return "";

  const hasTitle = table.title && table.title.trim() !== "";
  const hasHeaders = table.headers && table.headers.some(h => h && h.trim() !== "");
  const hasRows = table.rows && table.rows.flat().some(c => c && c.trim() !== "");

  if(!hasTitle && !hasHeaders && !hasRows){
    return "";
  }

  let html = "";

  if(hasTitle){
    html += `<h4>${table.title}</h4>`;
  }

  html += `<table class="preview-table">`;

  if(hasHeaders){
    html += "<tr>";
    table.headers.forEach(h=>{
      html += `<th>${h || ""}</th>`;
    });
    html += "</tr>";
  }

  if(table.rows){
    table.rows.forEach(row=>{
      if(row.some(c => c && c.trim() !== "")){
        html += "<tr>";
        row.forEach(c=>{
          html += `<td>${c || ""}</td>`;
        });
        html += "</tr>";
      }
    });
  }

  html += "</table>";
  return html;
}

let simulationId = getParam("id");
let library = JSON.parse(localStorage.getItem("teacherSimLibraryV5") || "[]");
let simulation = library.find(sim => sim.id === simulationId);

let currentStage = 0;
let score = 0;
let studentName = localStorage.getItem("pilotStudentName") || localStorage.getItem("studentName") || "Student";

if(!simulation){
  document.getElementById("content").innerHTML = "<h2>Simulation not found.</h2><p>Please return to the homepage.</p>";
  document.getElementById("options").innerHTML = "";
} else {
  showStage();
}

function showStage(){

  if(currentStage >= simulation.stages.length){
    finishSimulation();
    return;
  }

  const stage = simulation.stages[currentStage];

  let html = `<h2>${simulation.subject || ""}</h2>`;
  html += `<h3>${simulation.title || ""}</h3>`;
  html += `<div class="badge">Stage ${currentStage + 1}</div>`;
  html += `<h3>${stage.stageTitle || "Untitled Stage"}</h3>`;

  if(simulation.description){
    html += `<p><small><b>Description:</b> ${simulation.description}</small></p>`;
  }

  if(simulation.level){
    html += `<p><small><b>Level:</b> ${simulation.level}</small></p>`;
  }

  html += `<p>${(stage.scenarioText || "").replace(/\n/g,"<br>")}</p>`;

  if(stage.imageUrl){
    html += `<img src="${stage.imageUrl}" style="max-width:100%;border-radius:10px;margin-top:10px;">`;
  }

  if(stage.audioUrl){
    html += `<div style="margin-top:10px;"><audio controls src="${stage.audioUrl}" style="width:100%;"></audio></div>`;
  }

  const yt = getYouTubeEmbed(stage.videoUrl);
  if(yt){
    html += `<div style="margin-top:10px;">${yt}</div>`;
  } else if(stage.videoUrl){
    html += `<div style="margin-top:10px;"><video controls src="${stage.videoUrl}" style="width:100%;border-radius:10px;"></video></div>`;
  }

  html += renderTable(stage.table);

  document.getElementById("content").innerHTML = html;

  let buttons = "";
  stage.options.forEach((opt, index) => {
    if(opt.text && opt.text.trim() !== ""){
      const label = opt.label ? `<b>${opt.label}</b><br>` : "";
      buttons += `<button onclick="chooseOption(${index})">${label}${opt.text}</button>`;
    }
  });

  document.getElementById("options").innerHTML = buttons;
  document.getElementById("result").innerHTML = "";
}

function chooseOption(index){
  const stage = simulation.stages[currentStage];
  const selected = stage.options[index];

  score += Number(selected.points || 0);

  let next = selected.nextStage;

  if(next === "" || next === null || next === undefined){
    currentStage++;
  } else {
    next = Number(next);
    if(isNaN(next) || next < 1 || next > simulation.stages.length){
      currentStage++;
    } else {
      currentStage = next - 1;
    }
  }

  showStage();
}

function finishSimulation(){

  let feedback = "";

  if(score >= 15){
    feedback = "Excellent decisions throughout the simulation.";
  } else if(score >= 8){
    feedback = "Good performance, with room for improvement.";
  } else if(score >= 1){
    feedback = "Simulation completed. Review your choices and try again.";
  } else {
    feedback = "This path suggests weak decision-making. Reflection is recommended.";
  }

  document.getElementById("content").innerHTML =
    `<h2>${simulation.subject || ""}</h2>
     <h3>${simulation.title || ""}</h3>
     <h3>Simulation Complete</h3>
     <p><b>Student:</b> ${studentName}</p>`;

  document.getElementById("options").innerHTML = "";

  document.getElementById("result").innerHTML =
    `Final score: ${score}<br><br>${feedback}`;

  saveCustomResult();
}

function saveCustomResult(){
  let results = JSON.parse(localStorage.getItem("customResults") || "[]");

  results.push({
    name: studentName,
    simulation: simulation.title,
    score: score,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("customResults", JSON.stringify(results));
}

function restartSimulation(){
  currentStage = 0;
  score = 0;
  showStage();
}

function goHome(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
