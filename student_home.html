<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Area – SatooriLabs</title>
  <style>
    body{
      font-family:Arial, sans-serif;
      background:#f4f7fb;
      margin:0;
      padding:30px 20px;
    }
    .card{
      max-width:700px;
      margin:auto;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.08);
    }
    .logo{font-size:13px;color:#94a3b8;letter-spacing:0.5px;margin-bottom:4px;}
    h2{
      margin-top:0;
      color:#0f172a;
    }
    .who{
      background:#f0f9ff;
      border:1px solid #bae6fd;
      border-radius:10px;
      padding:12px 16px;
      margin-bottom:16px;
      color:#0c4a6e;
    }
    button{
      padding:12px 16px;
      margin:10px 10px 0 0;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
    }
    .blue{
      background:#2563eb;
      color:white;
    }
    .blue:hover{background:#1d4ed8;}
    .gray{
      background:#e5e7eb;
      color:#111827;
    }
    input{
      width:100%;
      box-sizing:border-box;
      padding:12px;
      margin-top:10px;
      border:1px solid #cbd5e1;
      border-radius:10px;
      font-size:15px;
    }
    small{color:#64748b;display:block;margin-top:10px;line-height:1.5;}
  </style>
</head>
<body>

<div class="card">
  <div class="logo">SATOORILABS</div>
  <h2>Student Area</h2>

  <div class="who" id="who"></div>

  <label style="font-weight:bold;">Have a simulation link from your teacher?</label>
  <input id="simulationLink" placeholder="Paste the simulation link here">

  <div style="margin-top:10px;">
    <button class="blue" onclick="openSimulation()">Open Simulation</button>
    <button class="gray" onclick="goResults()">My Results</button>
    <button class="gray" onclick="logoutStudent()">Switch student</button>
  </div>

  <small>
    Tip: the same link works as many times as you want. Every attempt is saved,
    so you can try to beat your best score.
  </small>
</div>

<script>
const STORAGE_KEY = "satooriStudent";

function getSavedStudent(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}

const student = getSavedStudent();

// This page is the student's home: no identity -> back to the door
if(!student || !student.name){
  window.location.href = "student_login.html";
} else {
  document.getElementById("who").innerHTML =
    "👤 <b>" + escapeHtml(student.name) + "</b>" +
    (student.groupName ? " &nbsp;·&nbsp; " + escapeHtml(student.groupName) : "") +
    (student.code ? " &nbsp;·&nbsp; code: <b>" + escapeHtml(student.code) + "</b>" : "");
}

function openSimulation(){
  const link = document.getElementById("simulationLink").value.trim();
  if(!link){
    alert("Please paste a simulation link.");
    return;
  }
  // Accept full links or just a file name like play_v5.html?id=XXXX
  window.location.href = link;
}

function goResults(){
  window.location.href = "student_library_v2.html";
}

function logoutStudent(){
  const really = confirm("Switch student? Your results stay saved - you can come back with the same name and code.");
  if(!really) return;
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem("studentName");
  localStorage.removeItem("pilotStudentName");
  window.location.href = "student_login.html";
}

function escapeHtml(s){
  return (s ?? "").toString().replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}
</script>

</body>
</html>
