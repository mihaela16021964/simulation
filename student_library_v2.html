<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SatooriLabs Student Library</title>

<style>
body{
  font-family:Arial;
  background:#f4f7fb;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td{
  padding:12px;
  border-bottom:1px solid #ddd;
}

th{
  background:#2563eb;
  color:white;
}
</style>

</head>

<body>

<div class="container">

<h2>My Simulation Library</h2>

<input type="text" id="studentSearch" placeholder="Enter your name"
style="width:100%;padding:10px;margin-top:10px;">

<button onclick="loadStudentResults()"
style="margin-top:10px;padding:10px;background:#2563eb;color:white;border:none;">

Load My Results

</button>

<table>
<thead>
<tr>
<th>Simulation</th>
<th>Score</th>
<th>Date</th>
</tr>
</thead>

<tbody id="studentResults">
</tbody>

</table>

</div>

<script>
function loadStudentResults(){

  let name = document.getElementById("studentSearch").value;

  let results = JSON.parse(localStorage.getItem("customResults") || "[]");

  let table = "";

  results.forEach(r => {
    if(r.name === name){
      table += "<tr>";
      table += "<td>" + (r.simulation || "") + "</td>";
      table += "<td>" + (r.score || "") + "</td>";
      table += "<td>" + (r.date || "") + "</td>";
      table += "</tr>";
    }
  });

  document.getElementById("studentResults").innerHTML = table;
}
</script>

</body>
</html>
