<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SatooriLabs Student Library</title>

<style>
body{
  font-family:Arial;
  background:#f4f7fb;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}

th, td{
  padding:12px;
  border-bottom:1px solid #ddd;
}

th{
  background:#2563eb;
  color:white;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.blue{
  background:#2563eb;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.gray{
  background:#e5e7eb;
}
</style>

</head>

<body>

<div class="container">

<h2>My Simulation Library</h2>

<input type="text" id="studentSearch" placeholder="Enter your name"
style="width:100%;padding:10px;margin-top:10px;">

<div style="margin-top:10px;">
  <button class="blue" onclick="loadStudentResults()">Load My Results</button>
  <button class="gray" onclick="goHome()">Homepage</button>
</div>

<table>
<thead>
<tr>
<th>Simulation</th>
<th>Score</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="studentResults">
</tbody>

</table>

</div>

<script>
let currentResults = [];

function loadStudentResults(){
  let name = document.getElementById("studentSearch").value.trim();
  let results = JSON.parse(localStorage.getItem("customResults") || "[]");

  currentResults = results
    .map((r, index) => ({ ...r, index }))
    .filter(r => r.name === name);

  let table = "";

  currentResults.forEach(r => {
    table += "<tr>";
    table += "<td>" + (r.simulation || "") + "</td>";
    table += "<td>" + (r.score || "") + "</td>";
    table += "<td>" + (r.date || "") + "</td>";
    table += `<td><button class="red" onclick="deleteResult(${r.index})">Delete</button></td>`;
    table += "</tr>";
  });

  if(currentResults.length === 0){
    table = `<tr><td colspan="4">No results found for this student.</td></tr>`;
  }

  document.getElementById("studentResults").innerHTML = table;
}

function deleteResult(index){
  const ok = confirm("Delete this result?");
  if(!ok) return;

  let results = JSON.parse(localStorage.getItem("customResults") || "[]");
  results.splice(index, 1);
  localStorage.setItem("customResults", JSON.stringify(results));

  loadStudentResults();
}

function goHome(){
  window.location.href = "index.html";
}
</script>

</body>
</html>
