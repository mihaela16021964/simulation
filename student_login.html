<!DOCTYPE html>
<html>
<head>
  <title>Student Login</title>
</head>

<body style="font-family:Arial; padding:40px;">

<h2>Student Login</h2>

<input id="name" placeholder="First name or nickname"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>
<button onclick="signup()">Sign up</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDotQaJXVcKgfRtUfOlHB1fT5Xa3iFRIyw",
  authDomain: "satoori-simulations.firebaseapp.com",
  projectId: "satoori-simulations"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.signup = async function(){
  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value;

  if(!name || !password){
    document.getElementById("msg").innerText = "Fill all fields";
    return;
  }

  const id = name.toLowerCase();

  await setDoc(doc(db, "students", id), {
    name: name,
    password: password
  });

  document.getElementById("msg").innerText = "Account created";
};

window.login = async function(){
  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value;

  const id = name.toLowerCase();

  const ref = doc(db, "students", id);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    document.getElementById("msg").innerText = "Student not found";
    return;
  }

  const data = snap.data();

  if(data.password !== password){
  document.getElementById("msg").innerText = "Wrong password";
  return;
}

localStorage.setItem("studentName", name);

window.location.href = "student_home.html";

    document.getElementById("msg").innerText = "Wrong password";
    return;
  }

  localStorage.setItem("studentName", name);

 window.location.href = "student_home.html";
};
</script>

</body>
</html>
