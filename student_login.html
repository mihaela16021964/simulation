<!DOCTYPE html>
<html>
<head>
<title>SatooriLabs — Student Login</title>

<style>

body{
font-family: Arial;
text-align:center;
background:#f0f4f8;
}

.box{
background:white;
width:300px;
margin:auto;
margin-top:100px;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

input{
width:90%;
padding:10px;
margin:10px;
}

button{
padding:10px 20px;
background:#007BFF;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Student Login</h2>

<input type="text" id="studentName" placeholder="Enter your name">

<br>

<button onclick="login()">
Enter Platform
</button>

</div>

<script>

function login(){

let name = document.getElementById("studentName").value;

if(name===""){
alert("Please enter your name");
return;
}

localStorage.setItem("studentName", name);

window.location.href="health_simulation_v2.html";

}

</script>

</body>
</html>
