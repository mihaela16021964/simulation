<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatooriLabs – Teacher Builder V4</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  margin:0;
  padding:20px;
}

.container{
  max-width:1300px;
  margin:auto;
  background:white;
  padding:24px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(0,0,0,0.08);
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.blue{ background:#2563eb; color:white; }
.green{ background:#16a34a; color:white; }
.gray{ background:#e5e7eb; }
.red{ background:#dc2626; color:white; }

.grid{
  display:grid;
  grid-template-columns:1.1fr 0.9fr;
  gap:20px;
}

label{
  font-weight:bold;
  display:block;
  margin-top:10px;
}

input, textarea, select{
  width:100%;
  padding:10px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  margin-top:6px;
  box-sizing:border-box;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.option-card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin-top:14px;
  background:#fafcff;
}

.option-grid{
  display:grid;
  grid-template-columns:1fr 120px 140px;
  gap:10px;
  margin-top:10px;
}

.preview{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
  background:#f8fafc;
  min-height:650px;
}

.badge{
  display:inline-block;
  padding:6px 12px;
  background:#dbeafe;
  color:#1d4ed8;
  border-radius:999px;
  font-size:13px;
  margin-bottom:10px;
}

.preview button{
  width:100%;
  margin-top:10px;
  background:#2563eb;
  color:white;
}

small{
  color:#475569;
}

.table-builder{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin-top:14px;
  background:#f9fafb;
}

.table-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.preview-table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
}

.preview-table td, .preview-table th{
  border:1px solid #cbd5e1;
  padding:8px;
}

.media-box{
  border:1px dashed #94a3b8;
  border-radius:10px;
  padding:10px;
  margin-top:8px;
  background:#f8fafc;
}
</style>
</head>
<body>

<div class="container">

  <h2>SatooriLabs – Teacher Builder V4</h2>
  <small>
    Global simulation title + multi-stage builder + textareas + points + temporary media browse + table block.
  </small>

  <div class="topbar">
    <button class="blue" onclick="addStage()">Add Stage</button>
    <button class="gray" onclick="prevStage()">Previous Stage</button>
    <button class="gray" onclick="nextStage()">Next Stage</button>
    <button class="green" onclick="saveCurrentStage()">Save Current Stage</button>
    <button class="blue" onclick="updatePreview()">Preview Current Stage</button>
    <button class="red" onclick="deleteStage()">Delete Current Stage</button>
  </div>

  <div class="grid">

    <div>
      <div class="badge" id="stageIndicator">Stage 1</div>

      <label>Simulation Title (global)</label>
      <input id="simulationTitle" placeholder="e.g. Geography – River Features">

      <label>Simulation Description (global, optional)</label>
      <textarea id="simulationDescription" placeholder="Describe the simulation as a whole..."></textarea>

      <label>Stage Title</label>
      <input id="stageTitle" placeholder="e.g. Stage 1 – Identify the feature">

      <label>Scenario Text</label>
      <textarea id="scenarioText" placeholder="Write the stage scenario..."></textarea>

      <label>Stage Image URL (optional)</label>
      <input id="imageUrl" placeholder="https://...jpg/png">

      <div class="media-box">
        <label>Browse Stage Image (temporary)</label>
        <input type="file" id="imageFile" accept="image/*" onchange="handleStageFile(event, 'image')">
      </div>

      <label>Stage Audio URL (optional)</label>
      <input id="audioUrl" placeholder="https://...mp3">

      <div class="media-box">
        <label>Browse Stage Audio (temporary)</label>
        <input type="file" id="audioFile" accept="audio/*" onchange="handleStageFile(event, 'audio')">
      </div>

      <label>Stage Video URL (optional)</label>
      <input id="videoUrl" placeholder="https://...mp4 or YouTube link">

      <div class="media-box">
        <label>Browse Stage Video (temporary)</label>
        <input type="file" id="videoFile" accept="video/*" onchange="handleStageFile(event, 'video')">
      </div>

      <div class="table-builder">
        <label>Optional Table Title</label>
        <input id="tableTitle" placeholder="e.g. Cashflow Table / Comparison Table">

        <label>Table Headers</label>
        <div class="table-row">
          <input id="th1" placeholder="Column 1">
          <input id="th2" placeholder="Column 2">
          <input id="th3" placeholder="Column 3">
        </div>

        <label>Row 1</label>
        <div class="table-row">
          <input id="r1c1" placeholder="Row1 Col1">
          <input id="r1c2" placeholder="Row1 Col2">
          <input id="r1c3" placeholder="Row1 Col3">
        </div>

        <label>Row 2</label>
        <div class="table-row">
          <input id="r2c1" placeholder="Row2 Col1">
          <input id="r2c2" placeholder="Row2 Col2">
          <input id="r2c3" placeholder="Row2 Col3">
        </div>

        <label>Row 3</label>
        <div class="table-row">
          <input id="r3c1" placeholder="Row3 Col1">
          <input id="r3c2" placeholder="Row3 Col2">
          <input id="r3c3" placeholder="Row3 Col3">
        </div>
      </div>

      <h3 style="margin-top:18px;">Options</h3>

      <div class="option-card">
        <b>Option 1</b>
        <textarea id="opt1" placeholder="Write the full decision / consequence / detailed option..."></textarea>
        <div class="option-grid">
          <input id="pts1" type="number" placeholder="Points" value="0">
          <input id="next1" type="number" placeholder="Next stage no.">
          <input id="opt1label" placeholder="Optional label">
        </div>
      </div>

      <div class="option-card">
        <b>Option 2</b>
        <textarea id="opt2" placeholder="Write the full decision / consequence / detailed option..."></textarea>
        <div class="option-grid">
          <input id="pts2" type="number" placeholder="Points" value="0">
          <input id="next2" type="number" placeholder="Next stage no.">
          <input id="opt2label" placeholder="Optional label">
        </div>
      </div>

      <div class="option-card">
        <b>Option 3</b>
        <textarea id="opt3" placeholder="Write the full decision / consequence / detailed option..."></textarea>
        <div class="option-grid">
          <input id="pts3" type="number" placeholder="Points" value="0">
          <input id="next3" type="number" placeholder="Next stage no.">
          <input id="opt3label" placeholder="Optional label">
        </div>
      </div>

      <div class="option-card">
        <b>Option 4</b>
        <textarea id="opt4" placeholder="Write the full decision / consequence / detailed option..."></textarea>
        <div class="option-grid">
          <input id="pts4" type="number" placeholder="Points" value="0">
          <input id="next4" type="number" placeholder="Next stage no.">
          <input id="opt4label" placeholder="Optional label">
        </div>
      </div>

      <div style="margin-top:20px;">
        <button class="green" onclick="saveSimulationToLibrary()">Save Full Simulation to Library V4</button>
      </div>

      <div id="message" style="margin-top:12px;font-weight:bold;"></div>
    </div>

    <div>
      <h3>Student Preview</h3>
      <div class="preview" id="previewBox">
        <p><i>Preview will appear here.</i></p>
      </div>
    </div>

  </div>
</div>

<script>
let currentStage = 0;

let simulationMeta = {
  title: "",
  description: ""
};

let stages = [
  createEmptyStage()
];

function createEmptyStage(){
  return {
    stageTitle:"",
    scenarioText:"",
    imageUrl:"",
    imageData:"",
    audioUrl:"",
    audioData:"",
    videoUrl:"",
    videoData:"",
    table:{
      title:"",
      headers:["","",""],
      rows:[
        ["","",""],
        ["","",""],
        ["","",""]
      ]
    },
    options:[
      {text:"", points:0, nextStage:"", label:""},
      {text:"", points:0, nextStage:"", label:""},
      {text:"", points:0, nextStage:"", label:""},
      {text:"", points:0, nextStage:"", label:""}
    ]
  };
}

function getYouTubeEmbed(url){
  if(!url) return "";
  let id = "";
  if(url.includes("watch?v=")){
    id = url.split("watch?v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1].split("?")[0];
  }
  if(id){
    return `<iframe width="100%" height="260" src="https://www.youtube.com/embed/${id}" frameborder="0" allowfullscreen></iframe>`;
  }
  return "";
}

function loadStageIntoForm(){
  const s = stages[currentStage];

  document.getElementById("stageIndicator").innerText = "Stage " + (currentStage + 1);

  document.getElementById("simulationTitle").value = simulationMeta.title;
  document.getElementById("simulationDescription").value = simulationMeta.description;

  document.getElementById("stageTitle").value = s.stageTitle;
  document.getElementById("scenarioText").value = s.scenarioText;
  document.getElementById("imageUrl").value = s.imageUrl;
  document.getElementById("audioUrl").value = s.audioUrl;
  document.getElementById("videoUrl").value = s.videoUrl;

  document.getElementById("tableTitle").value = s.table.title;
  document.getElementById("th1").value = s.table.headers[0];
  document.getElementById("th2").value = s.table.headers[1];
  document.getElementById("th3").value = s.table.headers[2];

  document.getElementById("r1c1").value = s.table.rows[0][0];
  document.getElementById("r1c2").value = s.table.rows[0][1];
  document.getElementById("r1c3").value = s.table.rows[0][2];

  document.getElementById("r2c1").value = s.table.rows[1][0];
  document.getElementById("r2c2").value = s.table.rows[1][1];
  document.getElementById("r2c3").value = s.table.rows[1][2];

  document.getElementById("r3c1").value = s.table.rows[2][0];
  document.getElementById("r3c2").value = s.table.rows[2][1];
  document.getElementById("r3c3").value = s.table.rows[2][2];

  for(let i=0;i<4;i++){
    document.getElementById("opt"+(i+1)).value = s.options[i].text;
    document.getElementById("pts"+(i+1)).value = s.options[i].points;
    document.getElementById("next"+(i+1)).value = s.options[i].nextStage;
    document.getElementById("opt"+(i+1)+"label").value = s.options[i].label;
  }
}

function saveCurrentStage(){
  simulationMeta.title = document.getElementById("simulationTitle").value;
  simulationMeta.description = document.getElementById("simulationDescription").value;

  let s = stages[currentStage];

  s.stageTitle = document.getElementById("stageTitle").value;
  s.scenarioText = document.getElementById("scenarioText").value;
  s.imageUrl = document.getElementById("imageUrl").value;
  s.audioUrl = document.getElementById("audioUrl").value;
  s.videoUrl = document.getElementById("videoUrl").value;

  s.table.title = document.getElementById("tableTitle").value;
  s.table.headers = [
    document.getElementById("th1").value,
    document.getElementById("th2").value,
    document.getElementById("th3").value
  ];

  s.table.rows = [
    [
      document.getElementById("r1c1").value,
      document.getElementById("r1c2").value,
      document.getElementById("r1c3").value
    ],
    [
      document.getElementById("r2c1").value,
      document.getElementById("r2c2").value,
      document.getElementById("r2c3").value
    ],
    [
      document.getElementById("r3c1").value,
      document.getElementById("r3c2").value,
      document.getElementById("r3c3").value
    ]
  ];

  s.options = [
    {
      text: document.getElementById("opt1").value,
      points: Number(document.getElementById("pts1").value || 0),
      nextStage: document.getElementById("next1").value,
      label: document.getElementById("opt1label").value
    },
    {
      text: document.getElementById("opt2").value,
      points: Number(document.getElementById("pts2").value || 0),
      nextStage: document.getElementById("next2").value,
      label: document.getElementById("opt2label").value
    },
    {
      text: document.getElementById("opt3").value,
      points: Number(document.getElementById("pts3").value || 0),
      nextStage: document.getElementById("next3").value,
      label: document.getElementById("opt3label").value
    },
    {
      text: document.getElementById("opt4").value,
      points: Number(document.getElementById("pts4").value || 0),
      nextStage: document.getElementById("next4").value,
      label: document.getElementById("opt4label").value
    }
  ];

  document.getElementById("message").innerText = "Stage " + (currentStage + 1) + " saved.";
}

function handleStageFile(event, type){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    if(type === "image"){
      stages[currentStage].imageData = e.target.result;
    }
    if(type === "audio"){
      stages[currentStage].audioData = e.target.result;
    }
    if(type === "video"){
      stages[currentStage].videoData = e.target.result;
    }
    document.getElementById("message").innerText = type + " temporarily stored for stage " + (currentStage + 1);
    updatePreview();
  };
  reader.readAsDataURL(file);
}

function addStage(){
  saveCurrentStage();
  stages.push(createEmptyStage());
  currentStage = stages.length - 1;
  loadStageIntoForm();
  updatePreview();
}

function prevStage(){
  saveCurrentStage();
  if(currentStage > 0){
    currentStage--;
    loadStageIntoForm();
    updatePreview();
  }
}

function nextStage(){
  saveCurrentStage();
  if(currentStage < stages.length - 1){
    currentStage++;
    loadStageIntoForm();
    updatePreview();
  }
}

function deleteStage(){
  if(stages.length === 1){
    alert("You must keep at least one stage.");
    return;
  }
  stages.splice(currentStage,1);
  if(currentStage >= stages.length){
    currentStage = stages.length - 1;
  }
  loadStageIntoForm();
  updatePreview();
}

function renderTable(table){
  const hasAnyHeader = table.headers.some(h => h && h.trim() !== "");
  const hasAnyData = table.rows.flat().some(c => c && c.trim() !== "");

  if(!hasAnyHeader && !hasAnyData && !table.title) return "";

  let html = "";
  if(table.title){
    html += `<h4>${table.title}</h4>`;
  }

  html += `<table class="preview-table">`;

  if(hasAnyHeader){
    html += "<tr>";
    table.headers.forEach(h=>{
      html += `<th>${h || ""}</th>`;
    });
    html += "</tr>";
  }

  table.rows.forEach(row=>{
    if(row.some(c => c && c.trim() !== "")){
      html += "<tr>";
      row.forEach(c=>{
        html += `<td>${c || ""}</td>`;
      });
      html += "</tr>";
    }
  });

  html += "</table>";
  return html;
}

function updatePreview(){
  saveCurrentStage();

  const s = stages[currentStage];
  const simTitle = simulationMeta.title || "Simulation Title";

  let html = `<h2>${simTitle}</h2>`;
  html += `<div class="badge">Stage ${currentStage + 1}</div>`;
  html += `<h3>${s.stageTitle || "Untitled Stage"}</h3>`;

  if(simulationMeta.description){
    html += `<p><small><b>Simulation:</b> ${simulationMeta.description}</small></p>`;
  }

  html += `<p>${(s.scenarioText || "").replace(/\n/g,"<br>")}</p>`;

  if(s.imageData){
    html += `<img src="${s.imageData}" style="max-width:100%;border-radius:10px;margin-top:10px;">`;
  } else if(s.imageUrl){
    html += `<img src="${s.imageUrl}" style="max-width:100%;border-radius:10px;margin-top:10px;">`;
  }

  if(s.audioData){
    html += `<div style="margin-top:10px;"><audio controls src="${s.audioData}" style="width:100%;"></audio></div>`;
  } else if(s.audioUrl){
    html += `<div style="margin-top:10px;"><audio controls src="${s.audioUrl}" style="width:100%;"></audio></div>`;
  }

  if(s.videoData){
    html += `<div style="margin-top:10px;"><video controls src="${s.videoData}" style="width:100%;border-radius:10px;"></video></div>`;
  } else {
    const yt = getYouTubeEmbed(s.videoUrl);
    if(yt){
      html += `<div style="margin-top:10px;">${yt}</div>`;
    } else if(s.videoUrl){
      html += `<div style="margin-top:10px;"><video controls src="${s.videoUrl}" style="width:100%;border-radius:10px;"></video></div>`;
    }
  }

  html += renderTable(s.table);

  html += `<hr><p><b>Choose:</b></p>`;

  s.options.forEach((opt, index)=>{
    if(opt.text){
      let label = opt.label ? `<b>${opt.label}</b><br>` : "";
      html += `<button>${label}${opt.text}</button>`;
    }
  });

  document.getElementById("previewBox").innerHTML = html;
}

function randomId(length=10){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for(let i=0;i<length;i++){
    out += chars[Math.floor(Math.random()*chars.length)];
  }
  return out;
}

function saveSimulationToLibrary(){
  saveCurrentStage();

  if(!simulationMeta.title.trim()){
    alert("Please add a simulation title.");
    return;
  }

  const simulationObject = {
    id: randomId(),
    title: simulationMeta.title,
    description: simulationMeta.description,
    createdAt: new Date().toLocaleString(),
    stages: stages
  };

  let library = JSON.parse(localStorage.getItem("teacherSimLibraryV4") || "[]");
  library.push(simulationObject);
  localStorage.setItem("teacherSimLibraryV4", JSON.stringify(library));

  document.getElementById("message").innerHTML =
    "Simulation saved to Teacher Library V4.";
}

loadStageIntoForm();
updatePreview();
</script>

</body>
</html>
