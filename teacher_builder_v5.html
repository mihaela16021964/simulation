<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatooriLabs – Teacher Builder V5 (Clean)</title>

<style>
  .container {
  max-width: 1400px;
  margin: auto;
}

.main-grid {
  display: grid;
  grid-template-columns: 250px 1fr 1fr;
  gap: 20px;
}

.panel {
  border: 1px solid #ccc;
  padding: 15px;
}
  .container {
  max-width: 1400px;
  margin: auto;
}

.main-grid {
  display: grid;
  grid-template-columns: 250px 1fr 1fr;
  gap: 20px;
}

.panel {
  border: 1px solid #ccc;
  padding: 15px;
}
body{ font-family: Arial; font-size:16px; }
.container{ max-width:1200px; margin:auto; padding:20px; }
.panel{ border:1px solid #ddd; padding:16px; margin-top:20px; }
button{ padding:10px 14px; margin-top:10px; cursor:pointer; }
textarea,input{ width:100%; margin-top:6px; padding:8px; }
.stage-btn.active{ background:#2563eb; color:white; }
.preview button{ display:block; width:100%; margin-top:10px; }
</style>
</head>

<body>

<div class="container">

<h2>Teacher Builder V5</h2>

<label>Subject</label>
<input id="subject">

<label>Title</label>
<input id="title">

<div class="panel">
<div id="stageButtons"></div>

<label>Stage Title</label>
<input id="stageTitle">

<label>Scenario</label>
<textarea id="scenario"></textarea>

<h3>Options</h3>

<textarea id="opt1"></textarea>
<textarea id="opt2"></textarea>
<textarea id="opt3"></textarea>
<textarea id="opt4"></textarea>

<button onclick="addStage()">Add Stage</button>
<button onclick="prevStage()">Prev</button>
<button onclick="nextStage()">Next</button>
<button onclick="saveStage()">Save Stage</button>
<button onclick="saveSimulation()">Save Full Simulation</button>
</div>

<div class="panel preview">
<h3>Preview</h3>
<div id="preview"></div>
</div>

</div>

<script>
function renderStageList() {
  const container = document.getElementById("stageList");
  container.innerHTML = "";

  stages.forEach((stage, index) => {
    const btn = document.createElement("button");
    btn.innerText = "Stage " + (index + 1);

    btn.style.display = "block";
    btn.style.marginBottom = "8px";
    btn.style.width = "100%";

    btn.onclick = () => {
      currentStage = index;
      loadStage();
      updatePreview();
    };

    container.appendChild(btn);
  });
}
let currentStage = 0;

let simulationMeta = {
  subject:"",
  title:""
};

let stages = [createEmptyStage()];

function createEmptyStage(){
  return {
    stageTitle:"",
    scenarioText:"",
    options:[
      {text:""},
      {text:""},
      {text:""},
      {text:""}
    ]
  };
}

function renderStageButtons(){
  let html="";
  stages.forEach((s,i)=>{
    html += `<button class="stage-btn ${i===currentStage?'active':''}" onclick="goToStage(${i})">
      Stage ${i+1}
    </button>`;
  });
  document.getElementById("stageButtons").innerHTML = html;
}

function goToStage(i){
  saveStage();
  currentStage = i;
  loadStage();
}

function loadStage(){
  let s = stages[currentStage];

  document.getElementById("subject").value = simulationMeta.subject;
  document.getElementById("title").value = simulationMeta.title;

  document.getElementById("stageTitle").value = s.stageTitle;
  document.getElementById("scenario").value = s.scenarioText;

  document.getElementById("opt1").value = s.options[0].text;
  document.getElementById("opt2").value = s.options[1].text;
  document.getElementById("opt3").value = s.options[2].text;
  document.getElementById("opt4").value = s.options[3].text;

  renderStageButtons();
  updatePreview();
}

function saveStage(){
  simulationMeta.subject = document.getElementById("subject").value;
  simulationMeta.title = document.getElementById("title").value;

  stages[currentStage] = {
    stageTitle: document.getElementById("stageTitle").value,
    scenarioText: document.getElementById("scenario").value,
    options:[
      { text: document.getElementById("opt1").value },
      { text: document.getElementById("opt2").value },
      { text: document.getElementById("opt3").value },
      { text: document.getElementById("opt4").value }
    ]
  };
}

function addStage(){
  saveStage();
  stages.push(createEmptyStage());
  currentStage = stages.length - 1;
  loadStage();
  
}
renderStageList();
function prevStage(){
  if(currentStage>0){
    saveStage();
    currentStage--;
    loadStage();
    
  }
}
renderStageList();
function nextStage(){
  if(currentStage < stages.length - 1){
    saveStage();
    currentStage++;
    loadStage();
    
  }
}
renderStageList();
function updatePreview(){
  let s = stages[currentStage];

  let html = `<h3>${s.stageTitle || "Untitled"}</h3>`;
  html += `<p>${s.scenarioText}</p>`;

  s.options.forEach(o=>{
    if(o.text){
      html += `<button>${o.text}</button>`;
    }
  });

  document.getElementById("preview").innerHTML = html;
}

function saveSimulation(){
  saveStage();

  const sim = {
    subject: simulationMeta.subject,
    title: simulationMeta.title,
    stages: stages
  };

  localStorage.setItem("teacherSim", JSON.stringify(sim));

  console.log("Saved:", sim);
  alert("Simulation saved locally");
}

loadStage();

</script>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDotQaJXVcKgfRtUfOlHB1fT5Xa3iFRIyw",
  authDomain: "satoori-simulations.firebaseapp.com",
  projectId: "satoori-simulations",
  storageBucket: "satoori-simulations.firebasestorage.app",
  messagingSenderId: "62316008106",
  appId: "1:62316008106:web:68a421970d857348e476d3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveSimulation = async function () {

  const sim = {
  meta: {
    subject: document.getElementById("subject").value,
    title: document.getElementById("title").value
  },

  stages: stages,

  createdAt: new Date()
};

  try {
    const docRef = await addDoc(collection(db, "simulations"), sim);
    console.log("Saved with ID:", docRef.id);
    alert("Saved to Firestore!");
  } catch (e) {
    console.error(e);
    alert("Error saving");
  }
};
renderStageList();
</script>
</body>
</html>
