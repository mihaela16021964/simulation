<!DOCTYPE html>

<style>

label{

textarea{

button{

.preview button{

.preview-table{

.preview-table td,

small{

<script>
  if(!localStorage.getItem("userLoggedIn")){
  alert("Please login first");
  window.location.href = "login.html";
}
let currentStage = 0;

let simulationMeta = {
  subject: "",
  title: "",
  description: "",
  level: "",
  teacherNotes: ""
};

let stages = [createEmptyStage()];

function createEmptyStage(){
  return {
    stageTitle:"",
    scenarioText:"",
    imageUrl:"",
    audioUrl:"",
    videoUrl:"",
    table:{
      title:"",
      headers:["","",""],
      rows:[
        ["","",""],
        ["","",""]
      ]
    },
    options:[
      {text:"", points:0, nextStage:"", label:""},
      {text:"", points:0, nextStage:"", label:""},
      {text:"", points:0, nextStage:"", label:""},
      {text:"", points:0, nextStage:"", label:""}
    ]
  };
}

  function goTracker(){
  window.location.href = "teacher_tracker_v1.html";
}
function getYouTubeEmbed(url){
  if(!url) return "";
  let id = "";
  if(url.includes("watch?v=")){
    id = url.split("watch?v=")[1].split("&")[0];
  } else if(url.includes("youtu.be/")){
    id = url.split("youtu.be/")[1].split("?")[0];
  }
 if(id){
  return `
    <div style="position:relative; width:100%; padding-bottom:56.25%; margin-top:10px;">
      <iframe 
        src="https://www.youtube.com/embed/${id}"
        style="position:absolute; top:0; left:0; width:100%; height:100%; border-radius:10px;"
        frameborder="0" 
        allowfullscreen>
      </iframe>
    </div>
  `;
}
return "";
}

function renderStageButtons(){
  let html = "";
  stages.forEach((s, index)=>{
    html += `
      <button class="${index === currentStage ? 'active' : ''}" onclick="goToStage(${index})">
        Stage ${index + 1}${s.stageTitle ? " – " + s.stageTitle : ""}
      </button>
    `;
  });
  document.getElementById("stageButtons").innerHTML = html;
}

function goToStage(index){
  saveCurrentStage();
  currentStage = index;
  loadStageIntoForm();
  updatePreview();
}

function loadStageIntoForm(){
  const s = stages[currentStage];

  document.getElementById("stageIndicator").innerText = "Stage " + (currentStage + 1);

  document.getElementById("simulationSubject").value = simulationMeta.subject;
  document.getElementById("simulationTitle").value = simulationMeta.title;
  document.getElementById("simulationDescription").value = simulationMeta.description;
  document.getElementById("simulationLevel").value = simulationMeta.level;
  document.getElementById("teacherNotes").value = simulationMeta.teacherNotes;

  document.getElementById("stageTitle").value = s.stageTitle;
  document.getElementById("scenarioText").value = s.scenarioText;
  document.getElementById("imageUrl").value = s.imageUrl;
  document.getElementById("audioUrl").value = s.audioUrl;
  document.getElementById("videoUrl").value = s.videoUrl;

  document.getElementById("tableTitle").value = s.table.title;
  document.getElementById("th1").value = s.table.headers[0];
  document.getElementById("th2").value = s.table.headers[1];
  document.getElementById("th3").value = s.table.headers[2];

  document.getElementById("r1c1").value = s.table.rows[0][0];
  document.getElementById("r1c2").value = s.table.rows[0][1];
  document.getElementById("r1c3").value = s.table.rows[0][2];
  document.getElementById("r2c1").value = s.table.rows[1][0];
  document.getElementById("r2c2").value = s.table.rows[1][1];
  document.getElementById("r2c3").value = s.table.rows[1][2];

  for(let i=0;i<4;i++){
    document.getElementById("opt"+(i+1)).value = s.options[i].text;
    document.getElementById("pts"+(i+1)).value = s.options[i].points;
    document.getElementById("next"+(i+1)).value = s.options[i].nextStage;
    document.getElementById("label"+(i+1)).value = s.options[i].label;
  }

  renderStageButtons();
}

function saveCurrentStage(){
  simulationMeta.subject = document.getElementById("simulationSubject").value;
  simulationMeta.title = document.getElementById("simulationTitle").value;
  simulationMeta.description = document.getElementById("simulationDescription").value;
  simulationMeta.level = document.getElementById("simulationLevel").value;
  simulationMeta.teacherNotes = document.getElementById("teacherNotes").value;

  stages[currentStage] = {
    stageTitle: document.getElementById("stageTitle").value,
    scenarioText: document.getElementById("scenarioText").value,
    imageUrl: document.getElementById("imageUrl").value,
    audioUrl: document.getElementById("audioUrl").value,
    videoUrl: document.getElementById("videoUrl").value,
    table:{
      title: document.getElementById("tableTitle").value,
      headers:[
        document.getElementById("th1").value,
        document.getElementById("th2").value,
        document.getElementById("th3").value
      ],
      rows:[
  {
    c1: document.getElementById("r1c1").value,
    c2: document.getElementById("r1c2").value,
    c3: document.getElementById("r1c3").value
  },
  {
    c1: document.getElementById("r2c1").value,
    c2: document.getElementById("r2c2").value,
    c3: document.getElementById("r2c3").value
  }
]
    },
    options:[
      {
        text: document.getElementById("opt1").value,
        points: Number(document.getElementById("pts1").value || 0),
        nextStage: document.getElementById("next1").value,
        label: document.getElementById("label1").value
      },
      {
        text: document.getElementById("opt2").value,
        points: Number(document.getElementById("pts2").value || 0),
        nextStage: document.getElementById("next2").value,
        label: document.getElementById("label2").value
      },
      {
        text: document.getElementById("opt3").value,
        points: Number(document.getElementById("pts3").value || 0),
        nextStage: document.getElementById("next3").value,
        label: document.getElementById("label3").value
      },
      {
        text: document.getElementById("opt4").value,
        points: Number(document.getElementById("pts4").value || 0),
        nextStage: document.getElementById("next4").value,
        label: document.getElementById("label4").value
      }
    ]
  };

  document.getElementById("message").innerText = "Stage " + (currentStage + 1) + " saved.";
  renderStageButtons();
}

function addStage(){
  saveCurrentStage();
  stages.push(createEmptyStage());
  currentStage = stages.length - 1;
  loadStageIntoForm();
  updatePreview();
}

function prevStage(){
  saveCurrentStage();
  if(currentStage > 0){
    currentStage--;
    loadStageIntoForm();
    updatePreview();
  }
}

function nextStage(){
  saveCurrentStage();
  if(currentStage < stages.length - 1){
    currentStage++;
    loadStageIntoForm();
    updatePreview();
  }
}

function deleteStage(){
  if(stages.length === 1){
    alert("You must keep at least one stage.");
    return;
  }
  stages.splice(currentStage, 1);
  if(currentStage >= stages.length){
    currentStage = stages.length - 1;
  }
  loadStageIntoForm();
  updatePreview();
}

 function goHome(){
  window.location.href = "teacher_home.html";
}

function goLibrary(){
  window.location.href = "library_teacher_v5.html";
}
  
function renderTable(table){
  const hasTitle = table.title && table.title.trim() !== "";
  const hasHeaders = table.headers.some(h => h && h.trim() !== "");
  const hasRows = table.rows.some(row =>
    (row.c1 && row.c1.trim() !== "") ||
    (row.c2 && row.c2.trim() !== "") ||
    (row.c3 && row.c3.trim() !== "")
  );

  if(!hasTitle && !hasHeaders && !hasRows){
    return "";
  }

  let html = "";
  if(hasTitle){
    html += `<h4>${table.title}</h4>`;
  }

  html += `<table class="preview-table">`;

  if(hasHeaders){
    html += "<tr>";
    table.headers.forEach(h=>{
      html += `<th>${h || ""}</th>`;
    });
    html += "</tr>";
  }

  table.rows.forEach(row => {
    const hasContent =
      (row.c1 && row.c1.trim() !== "") ||
      (row.c2 && row.c2.trim() !== "") ||
      (row.c3 && row.c3.trim() !== "");

    if (hasContent) {
      html += "<tr>";
      html += `<td>${row.c1 || ""}</td>`;
      html += `<td>${row.c2 || ""}</td>`;
      html += `<td>${row.c3 || ""}</td>`;
      html += "</tr>";
    }
  });

  html += "</table>";
  return html;
}
function updatePreview(){
  saveCurrentStage();

  const s = stages[currentStage];

  let html = `<h2>${simulationMeta.subject || "Subject"}</h2>`;
  html += `<h3>${simulationMeta.title || "Simulation Title"}</h3>`;
  html += `<div class="badge">Stage ${currentStage + 1}</div>`;
  html += `<h3>${s.stageTitle || "Untitled Stage"}</h3>`;

  if(simulationMeta.description){
    html += `<p><small><b>Description:</b> ${simulationMeta.description}</small></p>`;
  }

  if(simulationMeta.level){
    html += `<p><small><b>Level:</b> ${simulationMeta.level}</small></p>`;
  }

  html += `<p>${(s.scenarioText || "").replace(/\n/g,"<br>")}</p>`;

  if(s.imageUrl){
    html += `<img src="${s.imageUrl}" style="max-width:100%;border-radius:10px;margin-top:10px;">`;
  }

  if(s.audioUrl){
    html += `<div style="margin-top:10px;"><audio controls src="${s.audioUrl}" style="width:100%;"></audio></div>`;
  }

  const yt = getYouTubeEmbed(s.videoUrl);
  if(yt){
    html += `<div style="margin-top:10px;">${yt}</div>`;
  } else if(s.videoUrl){
    html += `<div style="margin-top:10px;"><video controls src="${s.videoUrl}" style="width:100%;border-radius:10px;"></video></div>`;
  }

  html += renderTable(s.table);

  html += `<hr><p><b>Choose:</b></p>`;

  s.options.forEach((opt)=>{
    if(opt.text && opt.text.trim() !== ""){
      const label = opt.label ? `<b>${opt.label}</b><br>` : "";
      html += `<button>${label}${opt.text}</button>`;
    }
  });

  document.getElementById("previewBox").innerHTML = html;
}

function randomId(length=10){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for(let i=0;i<length;i++){
    out += chars[Math.floor(Math.random()*chars.length)];
  }
  return out;
}

async function saveSimulationToLibrary(){
  const saveBtn = document.getElementById("saveSimulationBtn");

  if(saveBtn.disabled){
    return;
  }

  saveBtn.disabled = true;
  saveBtn.innerText = "Saving...";

  saveCurrentStage();

  if(!simulationMeta.subject.trim()){
    alert("Please add a subject.");
    saveBtn.disabled = false;
    saveBtn.innerText = "Save Full Simulation";
    return;
  }

  if(!simulationMeta.title.trim()){
    alert("Please add a simulation title.");
    saveBtn.disabled = false;
    saveBtn.innerText = "Save Full Simulation";
    return;
  }

  const simulationObject = {
    id: randomId(),
    subject: simulationMeta.subject,
    title: simulationMeta.title,
    description: simulationMeta.description,
    level: simulationMeta.level,
    teacherNotes: simulationMeta.teacherNotes,
    createdAt: new Date().toLocaleString(),
    stages: JSON.parse(JSON.stringify(stages))
  };

  let library = JSON.parse(localStorage.getItem("teacherSimLibraryV5") || "[]");
  library.push(simulationObject);
  localStorage.setItem("teacherSimLibraryV5", JSON.stringify(library));

  try {
    const docRef = await window.saveToFirestore(simulationObject);
    console.log("Saved to Firestore:", docRef.id);
    document.getElementById("message").innerHTML =
      "Simulation saved to Teacher Library V5 and Firestore.";
  } catch (error) {
    console.error("Firestore save failed:", error);
    document.getElementById("message").innerHTML =
      "Simulation saved locally, but Firestore failed. Check console.";
  } finally {
    saveBtn.disabled = false;
    saveBtn.innerText = "Save Full Simulation";
  }
}
loadStageIntoForm();
updatePreview();
</script>

import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDotQaJXVcKgfRtUfOlHB1fT5Xa3iFRIyw",
  authDomain: "satoori-simulations.firebaseapp.com",
  projectId: "satoori-simulations",
  storageBucket: "satoori-simulations.firebasestorage.app",
  messagingSenderId: "62316008106",
  appId: "1:62316008106:web:68a421970d857348e476d3"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user || !user.email) {
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  try {
    const ref = doc(db, "users", user.email);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      alert("No teacher access found for this account.");
      window.location.href = "index.html";
      return;
    }

    const access = snap.data();

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const start = new Date(access.accessStart);
    const end = new Date(access.accessEnd);

    if (
      access.role !== "teacher" ||
      access.active !== true ||
      access.paidTeacher !== true ||
      isNaN(start) ||
      isNaN(end) ||
      today < start ||
      today > end
    ) {
      alert("Your teacher access is not active.");
      window.location.href = "index.html";
      return;
    }

  } catch (error) {
    console.error("Access check failed:", error);
    alert("Could not verify teacher access.");
    window.location.href = "index.html";
  }
});
</script>
