<!DOCTYPE html>
<html>
<head>

<title>SatooriLabs Teacher Tool</title>

<style>

body{
font-family:Arial;
background:#eef4fa;
padding:30px;
}

.box{
background:white;
padding:20px;
max-width:800px;
margin:auto;
border-radius:10px;
}

input, textarea{
width:100%;
margin:8px 0;
padding:10px;
}

button{
padding:12px;
background:#1976d2;
color:white;
border:none;
margin-top:10px;
width:100%;
}

</style>

</head>

<body>

<div class="box">

<h2>Create Simulation</h2>

<label>Stage 1 Scenario</label>
<textarea id="s1"></textarea>

<label>Option A</label>
<input id="s1a">
<label>Points</label>
<input id="p1a">

<label>Option B</label>
<input id="s1b">
<label>Points</label>
<input id="p1b">

<label>Option C</label>
<input id="s1c">
<label>Points</label>
<input id="p1c">

<label>Option D</label>
<input id="s1d">
<label>Points</label>
<input id="p1d">

<button onclick="save()">Save Simulation</button>

</div>

<script>

function save(){

let data={

scenario:document.getElementById("s1").value,

options:[

{text:document.getElementById("s1a").value,points:document.getElementById("p1a").value},

{text:document.getElementById("s1b").value,points:document.getElementById("p1b").value},

{text:document.getElementById("s1c").value,points:document.getElementById("p1c").value},

{text:document.getElementById("s1d").value,points:document.getElementById("p1d").value}

]

};

localStorage.setItem("simulation",JSON.stringify(data));

alert("Simulation Saved");

}

</script>

</body>

</html>
