<!DOCTYPE html>
<html>
<head>

<title>SatooriLabs Teacher Tool</title>

<style>

body{
font-family:Arial;
background:#eef4fa;
padding:20px;
}

.box{
background:white;
padding:20px;
max-width:900px;
margin:auto;
border-radius:10px;
margin-bottom:20px;
}

textarea,input{
width:100%;
padding:8px;
margin:5px 0;
}

button{
padding:12px;
background:#1976d2;
color:white;
border:none;
width:100%;
margin-top:10px;
cursor:pointer;
}

</style>

</head>

<body>

<h1>SatooriLabs Simulation Creator</h1>

<div id="container"></div>

<button onclick="save()">SAVE SIMULATION</button>

<button onclick="exportSim()">EXPORT FILE</button>

<script>

let stages=4;

let container=document.getElementById("container");

for(let i=1;i<=stages;i++){

container.innerHTML+=`

<div class="box">

<h3>Stage ${i}</h3>

<textarea id="scenario${i}" placeholder="Scenario"></textarea>

<input id="A${i}" placeholder="Option A">
<input id="Ap${i}" placeholder="Points">

<input id="B${i}" placeholder="Option B">
<input id="Bp${i}" placeholder="Points">

<input id="C${i}" placeholder="Option C">
<input id="Cp${i}" placeholder="Points">

<input id="D${i}" placeholder="Option D">
<input id="Dp${i}" placeholder="Points">

</div>

`;

}

function save(){

let sim=[];

for(let i=1;i<=stages;i++){

sim.push({

scenario:document.getElementById("scenario"+i).value,

options:[

{text:document.getElementById("A"+i).value,points:document.getElementById("Ap"+i).value},

{text:document.getElementById("B"+i).value,points:document.getElementById("Bp"+i).value},

{text:document.getElementById("C"+i).value,points:document.getElementById("Cp"+i).value},

{text:document.getElementById("D"+i).value,points:document.getElementById("Dp"+i).value}

]

});

}

localStorage.setItem("sim",JSON.stringify(sim));

alert("Saved");

}

function exportSim(){

let data=localStorage.getItem("sim");

let blob=new Blob([data],{type:"application/json"});

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="simulation.json";

a.click();

}

</script>

</body>
</html>
