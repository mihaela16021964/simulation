<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SatooriLabs – Tracker</title>

<style>
  body{font-family:Arial;background:#f4f7fb;margin:0;}
  .card{max-width:1200px;margin:24px auto;background:#fff;padding:22px;border-radius:12px;box-shadow:0 0 10px rgba(0,0,0,.08);}
  h2{margin:0 0 8px 0;}
  small{color:#475569}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px;}
  .row > *{flex:1;min-width:180px;}
  input, select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;}
  button{padding:10px 12px;border:none;border-radius:10px;cursor:pointer;}
  .blue{background:#2563eb;color:#fff;}
  .gray{background:#e5e7eb;}
  table{width:100%;border-collapse:collapse;margin-top:14px;}
  th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top;}
  th{background:#2563eb;color:#fff;}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:bold;}
  .co{background:#dcfce7;color:#166534;}
  .ns{background:#fee2e2;color:#991b1b;}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
</style>
</head>

<body>

<div class="card">
  <h2>Teacher Tracker</h2>
  <small>
    Attempts, best score, last score, and last attempt date from Firestore.
  </small>

  <div class="row" style="margin-top:16px;">
    <input id="studentFilter" placeholder="Filter by student name" oninput="render()">
    <select id="simFilter" onchange="render()">
      <option value="">All simulations</option>
    </select>
    <button id="refreshBtn" class="blue" onclick="refreshTracker()">Refresh</button>
    <button class="gray" onclick="exportCSV()">Export CSV</button>
  </div>

  <div class="row" style="margin-top:10px;">
    <a href="teacher_builder_v5_backup.html"><button class="gray" type="button">Builder</button></a>
    <a href="library_teacher_v5.html"><button class="gray" type="button">Teacher Library</button></a>
    <a href="index.html"><button class="gray" type="button">Homepage</button></a>
  </div>

  <table>
    <thead>
      <tr>
        <th>Student</th>
        <th>Simulation</th>
        <th>Status</th>
        <th>Attempts</th>
        <th>Best score</th>
        <th>Last score</th>
        <th>Last attempt</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="summary" style="margin-top:12px;"></div>
</div>

<script>
function safe(s){
  return (s ?? "").toString().replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function statusFor(attempts){
  if(attempts <= 0) return "Not started";
  return "Completed";
}

function pill(status){
  if(status === "Completed") return `<span class="pill co">Completed</span>`;
  return `<span class="pill ns">Not started</span>`;
}

function dateKey(d){
  const t = Date.parse(d);
  return isNaN(t) ? 0 : t;
}

function buildTracker(attempts){
  const map = new Map();

  for(const a of attempts){
    const key = `${a.name}||${a.simulation}`;
    if(!map.has(key)){
      map.set(key, {
        name: a.name,
        sim: a.simulation,
        attempts: 0,
        best: -Infinity,
        lastScore: null,
        lastDate: "",
        lastDateSort: 0
      });
    }

    const row = map.get(key);
    row.attempts += 1;

    if(a.score > row.best) row.best = a.score;

    const dSort = dateKey(a.date);
    if(dSort >= row.lastDateSort){
      row.lastDateSort = dSort;
      row.lastDate = a.date || row.lastDate;
      row.lastScore = a.score;
    }
  }

  const out = Array.from(map.values()).map(r => ({
    ...r,
    status: statusFor(r.attempts),
    best: (r.best === -Infinity ? 0 : r.best)
  }));

  out.sort((a,b)=>{
    const n = a.name.localeCompare(b.name);
    if(n !== 0) return n;
    return a.sim.localeCompare(b.sim);
  });

  return out;
}

function fillSimFilter(trackerRows){
  const sel = document.getElementById("simFilter");
  const current = sel.value;

  const sims = Array.from(new Set(trackerRows.map(r => r.sim))).sort((a,b)=>a.localeCompare(b));
  sel.innerHTML = `<option value="">All simulations</option>` +
    sims.map(s => `<option value="${safe(s)}">${safe(s)}</option>`).join("");

  if(sims.includes(current)) sel.value = current;
}

let CACHE = { attempts: [], tracker: [] };

async function loadAttemptsFromFirestore(){
  const snapshot = await window.getResultsLibrary();
  const attempts = [];

  snapshot.forEach(docSnap => {
    const r = docSnap.data();

    attempts.push({
      name: (r.name || "").toString().trim(),
      simulation: (r.simulation || "").toString().trim(),
      score: Number(r.score || 0),
      date: (r.date || "").toString().trim()
    });
  });

  return attempts;
}

function render(){
  const studentText = document.getElementById("studentFilter").value.trim().toLowerCase();
  const sim = document.getElementById("simFilter").value;

  let rows = CACHE.tracker;

  if(studentText){
    rows = rows.filter(r => r.name.toLowerCase().includes(studentText));
  }

  if(sim){
    rows = rows.filter(r => r.sim === sim);
  }

  const tbody = document.getElementById("rows");

  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="7">No results match your filters yet.</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td><b>${safe(r.name)}</b></td>
        <td>${safe(r.sim)}</td>
        <td>${pill(r.status)}</td>
        <td class="mono">${r.attempts}</td>
        <td class="mono">${safe(r.best)}</td>
        <td class="mono">${safe(r.lastScore ?? "")}</td>
        <td>${safe(r.lastDate)}</td>
      </tr>
    `).join("");
  }

  document.getElementById("summary").innerHTML =
    `<small><b>Total attempts saved:</b> ${CACHE.attempts.length} &nbsp; | &nbsp; <b>Tracked student+simulation rows:</b> ${CACHE.tracker.length}</small>`;
}

async function refreshTracker(){
  document.getElementById("rows").innerHTML = `<tr><td colspan="7">Loading...</td></tr>`;

  try {
    CACHE.attempts = await loadAttemptsFromFirestore();
    CACHE.tracker = buildTracker(CACHE.attempts);
    fillSimFilter(CACHE.tracker);
    render();
  } catch(error){
    console.error("Tracker load failed:", error);
    document.getElementById("rows").innerHTML = `<tr><td colspan="7">Could not load tracker from Firestore.</td></tr>`;
  }
}

function exportCSV(){
  let rows = CACHE.tracker;

  const studentText = document.getElementById("studentFilter").value.trim().toLowerCase();
  const sim = document.getElementById("simFilter").value;

  if(studentText) rows = rows.filter(r => r.name.toLowerCase().includes(studentText));
  if(sim) rows = rows.filter(r => r.sim === sim);

  const header = ["Student","Simulation","Status","Attempts","BestScore","LastScore","LastAttempt"];
  const lines = [header.join(",")];

  for(const r of rows){
    const line = [
      r.name, r.sim, r.status, r.attempts, r.best, (r.lastScore ?? ""), (r.lastDate ?? "")
    ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(",");
    lines.push(line);
  }

  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "satoorilabs_tracker.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

window.refreshTracker = refreshTracker;
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDotQaJXVcKgfRtUfOlHB1fT5Xa3iFRIyw",
  authDomain: "satoori-simulations.firebaseapp.com",
  projectId: "satoori-simulations",
  storageBucket: "satoori-simulations.firebasestorage.app",
  messagingSenderId: "62316008106",
  appId: "1:62316008106:web:68a421970d857348e476d3"

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDotQaJXVcKgfRtUfOlHB1fT5Xa3iFRIyw",
  authDomain: "satoori-simulations.firebaseapp.com",
  projectId: "satoori-simulations",
  storageBucket: "satoori-simulations.firebasestorage.app",
  messagingSenderId: "62316008106",
  appId: "1:62316008106:web:68a421970d857348e476d3"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user || !user.email) {
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  try {
    const ref = doc(db, "users", user.email);
    const snap = await getDoc(ref);

    if (!snap.exists()) {
      alert("No teacher access found for this account.");
      window.location.href = "index.html";
      return;
    }

    const access = snap.data();

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const start = new Date(access.accessStart);
    const end = new Date(access.accessEnd);

    if (
      access.role !== "teacher" ||
      access.active !== true ||
      access.paidTeacher !== true ||
      isNaN(start) ||
      isNaN(end) ||
      today < start ||
      today > end
    ) {
      alert("Your teacher access is not active.");
      window.location.href = "index.html";
      return;
    }

  } catch (error) {
    console.error("Access check failed:", error);
    alert("Could not verify teacher access.");
    window.location.href = "index.html";
  }
});
</script>
</body>
</html>
